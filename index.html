<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/darkmodetoggle.js" defer></script>
</head>
<body>

  <!-- Header & Theme Toggle (Mission 3) -->
  <header class="mb-5">
    <div class="container mt-5">
      <div class="d-flex justify-content-end">
        <div class="btn-group">
          <button class="btn btn-secondary btn-sm" data-bs-theme-value="dark">Dark</button>
          <button class="btn btn-light btn-sm" data-bs-theme-value="light">Light</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Search & Navigation Area (Mission 4) -->
  <div class="container">
    <h1 class="mb-4">Users</h1>
    <div class="row">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-lg" placeholder="Search Users">
      </div>
      <div class="col-md-8 d-flex justify-content-end align-items-center user-menu">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-dark" href="#">Reputation</a></li>
          <li class="nav-item"><a class="nav-link text-bg-primary rounded-3" href="#">New Users</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#">Editors</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="#">Moderators</a></li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
